<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <div class="header-container">
            <img src="{{Janotghi-text-logo.svg}}" alt="Janotghi-Logo">
            <img src="{{Uteam-text-logo.svg}}" alt="Uteam-Logo">
        </div>

        <div class="main-content">
            <div class="eye-img">
                <img src="{{eye-img.svg}}" alt="Eye-Image">
            </div>
            <div class="banner">
                <p class="banner-tag">سلام فلانی؛ رمزت رو یادت رفته؟</p>
            </div>
            <div class="main-content-card">
                <p class="card-header">اگر رمزعبور خود را فراموش کردید و یا مایل به تعویض<br/>
                    رمز عبور خود هستید، بر روی لینک زیر کلیک کنید.</p>
                <a href="{{RESET_LINK}}" class="card-button">
                    <p class="card-button-text">تغییر رمز عبور</p>
                </a>
                <p class="card-footer">در صورتی که شما درخواست تعویض رمزعبور نداده‌اید، نگران نباشید.<br/>
                        تنها کسی که به این ایمیل دسترسی داشته باشد می‌‌تواند رمزعبور شما را عوض کند.</p>
            </div>
        </div>

        <div class="footer-container">
            <img src="{{copyright-logo.svg}}" alt="Copyright-Logo">
        </div>
    </div>
</body>
</html>
