<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
</head>

<body style="background-color: #E1E1E1; margin: 0; padding: 0; 
             font-family: Georgia, 'Times New Roman', Times, serif; direction: rtl;">

    <!-- Main Wrapper -->
    <table width="100%" cellspacing="0" cellpadding="0" style="background-color: #E1E1E1; padding: 20px 0;">
        <tr>
            <td align="center">
                <!-- Email Container -->
                <table width="600" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 8px; 
                                                                          padding: 20px;">
                    <!-- Header Section -->
                    <tr>
                        <td align="center" style="padding: 20px 0;">
                            <img src="{{Uteam-text-logo.svg}}" alt="Uteam-Logo" style="float: left; height: 50px;">
                            <img src="{{Janotghi-text-logo.svg}}" alt="Janotghi-Logo" style="float: right; height: 50px;">
                        </td>
                    </tr>

                    <!-- Banner Section -->
                    <tr>
                        <td align="center" style="padding: 20px;">
                            <img src="{{eye-img.svg}}" alt="Eye Image" style="display: block; margin: 0 auto; max-width: 100%; 
                                                                              height: auto;">
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="font-size: 24px; font-weight: 900; color: #1E1E1E;">
                            چطوری {0}؛ رمزت رو یادت رفته {1}؟
                        </td>
                    </tr>

                    <!-- Card Section -->
                    <tr>
                        <td align="center" style="padding: 20px 0;">
                            <table width="80%" cellspacing="0" cellpadding="0" style="background-color: #10A27B80; 
                                                                                      border-radius: 32px; padding: 20px; 
                                                                                      text-align: center;">
                                <tr>
                                    <td style="font-size: 16px; font-weight: bold; color: #191919; padding-bottom: 20px;">
                                        اگر رمزعبور خود را فراموش کردید و یا مایل به تعویض<br/> رمز عبور خود هستید، بر روی لینک زیر کلیک کنید.
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center">
                                        <a href="{{RESET_LINK}}" style="background-color: #4A605A; color: #FEE9E7; 
                                                                        font-size: 16px; width: 40%; font-weight: bold; 
                                                                        text-decoration: none; padding: 15px 30px; border-radius: 6px; 
                                                                        border: 1px solid var(--Border-Danger-Secondary, #C00F0C); 
                                                                        display: inline-block;">
                                            تغییر رمز عبور
                                        </a>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="font-size: 12px; font-weight: 900; line-height: 20px; color: #00000063; 
                                               padding-top: 20px;">
                                        در صورتی که شما درخواست تعویض رمزعبور نداده‌اید، نگران نباشید.<br/> تنها کسی که به این ایمیل دسترسی داشته باشد می‌‌تواند رمزعبور شما را<br/> عوض کند.
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer Section -->
                    <tr>
                        <td align="center" style="padding-top: 20px;">
                            <img src="{{copyright-logo.svg}}" alt="Copyright Logo" style="display: block; height: 60px;">
                        </td>
                    </tr>
                </table>
                <!-- End of Email Container -->
            </td>
        </tr>
    </table>
    <!-- End of Main Wrapper -->

</body>

</html>
