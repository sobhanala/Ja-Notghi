<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="backLayer">
        <div class="forgotPasswordContainer">
            <div class="forgotPasswordLogo">
                <img class="imgLogo" src="./assets/logo.svg" alt="forgot-password-logo">
            </div>
            <form class="forgetPasswordForm" action="">
                <div class="textInputGroup">
                    <label class="inputLabel" for="email">ایمیل</label>
                    <input class="textInput" type="text" id="email" placeholder="ایمیل خود را وارد کنید.">
                </div>
                <input class="formBtn" type="submit" value="ارسال لینک">
            </form>
        </div>
        <div class="footerLogoContainer">
            <img class="footerLogoImg" src="./assets/footer-logo.svg" alt="footer-logo">
        </div>
    </div>
</body>
</html>
