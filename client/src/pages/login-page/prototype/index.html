<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="back-layer">
        <div class="login-container">
            <div class="login-logo">
                <img class="img-logo" src="./assets/logo.svg" alt="login-logo">
            </div>
            <form class="login-form" action="">
                <div class="text-input-group">
                    <label class="input-label" for="email">ایمیل</label>
                    <input class="text-input" type="text" id="email" placeholder="ایمیل خود را وارد کنید">
                </div>
                <div class="text-input-group">
                    <label class="input-label" for="password">رمز عبور</label>
                    <input class="text-input" type="password" id="password" placeholder="رمز عبور خود را وارد کنید">
                </div>
                <input class="form-btn" type="submit" value="ورود">
                <a class="forgot-password" href="#">فراموشی رمز عبور</a>
                <button class="form-btn" href="#">عضویت</button>
            </form>
            <div>
                <img src="./assets/footer-logo.svg" alt="footer-logo">
            </div>
        </div>
    </div>    
</body>
</html>
