services:
  backend:
    build:
      context: ./server
      dockerfile: backend.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - migrate
    networks:
      - app-network
    volumes:
      - ./shared\/forget-password-email:/app/utils
    env_file:
      - server/API/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    dns:
      - 8.8.8.8
      - 8.8.4.4
  
  migrate:
    build:
      context: ./server
      dockerfile: migrate.Dockerfile
    environment:
      DATABASE_URL: Host=db;Port=5432;Database=facebook;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: facebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./client
      dockerfile: frontend.Dockerfile
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - app-network


volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge